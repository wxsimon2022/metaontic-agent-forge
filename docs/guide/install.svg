<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="552" viewBox="0 0 1040 552" role="img" aria-labelledby="title desc">
<title id="title">安装插件：从添加到打开</title><desc id="desc">操作示意图 · 菜单名称以 Deepseek-Harness 实际界面为准</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif} .h{font-size:28px;font-weight:700;fill:#20242d}.sub{font-size:17px;fill:#737b8b}.label{font-size:20px;font-weight:600;fill:#20242d}.line{font-size:18px;fill:#737b8b}</style>
<rect width="1040" height="552" rx="12" fill="#f1f3f7"/>
<text x="32" y="48" class="h">安装插件：从添加到打开</text>
<text x="32" y="80" class="sub">操作示意图 · 菜单名称以 Deepseek-Harness 实际界面为准</text>
<rect x="32" y="108" width="976" height="110" rx="8" fill="white" stroke="#dfe3eb"/>
<rect x="32" y="108" width="5" height="110" rx="2" fill="#247bbf"/>
<text x="54" y="142" class="label">① 打开 Deepseek-Harness → 插件 → 添加插件</text>
<text x="54" y="177" class="line">粘贴正式版 .tgz 附件下载链接，按提示完成安装。</text>
<rect x="32" y="238" width="976" height="140" rx="8" fill="white" stroke="#dfe3eb"/>
<rect x="32" y="238" width="5" height="140" rx="2" fill="#247bbf"/>
<text x="54" y="272" class="label">② 发布页 → 复制 .tgz 附件下载链接</text>
<text x="54" y="307" class="line">GitHub Releases 或 Gitee Releases → 附件</text>
<text x="54" y="336" class="line">Windows 可下载 .tgz，填写文件绝对路径安装</text>
<rect x="32" y="398" width="976" height="110" rx="8" fill="white" stroke="#dfe3eb"/>
<rect x="32" y="398" width="5" height="110" rx="2" fill="#247bbf"/>
<text x="54" y="432" class="label">③ 已安装插件 → MetaOnticVideo → 查看</text>
<text x="54" y="467" class="line">进入设置页，选择接入方式；配置后选择“视频创作助手”开始。</text>
</svg>
