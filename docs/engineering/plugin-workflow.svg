<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1620" viewBox="0 0 1600 1620"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b7696"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#24364e}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#64758a}.section{font-size:20px;font-weight:700}.node-title{font-size:20px;font-weight:650}.body{font-size:16px}.code{font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;fill:#61758f}.small{font-size:14px;fill:#65788d}.edge{fill:none;stroke:#5b7696;stroke-width:2;marker-end:url(#arrow)}.edge-label{font-size:14px;fill:#415d7c}</style><rect width="1600" height="1620" fill="#f2f5fa"/><text x="48" y="63" class="title">MetaOnticVideo · 插件流程架构</text><text x="48" y="98" class="sub">依据当前工作区源码｜需求确认 → 审核 → 按段生成 → 预览续做 → 本机交付</text><rect x="40" y="130" width="970" height="1390" rx="18" fill="#fff" stroke="#dbe3ee"/><rect x="1040" y="130" width="520" height="1390" rx="18" fill="#fff" stroke="#dbe3ee"/><text x="68" y="169" class="section">创作主流程</text><text x="1068" y="169" class="section">模块、状态与恢复</text>
<rect x="90" y="195" width="550" height="120" rx="12" fill="#eef5ff" stroke="#c9dbf4"/>
<text x="110" y="226" class="node-title">01 需求确认</text>
<text x="110" y="253" class="body">时长未指定：15 / 30 / 45 / 60 秒 / 自定义</text>
<text x="110" y="276" class="body">自定义输入4–120整数秒；同时确认画幅和清晰度</text>
<text x="110" y="301" class="code">video_project.prepare · duration-choice</text>
<rect x="90" y="335" width="550" height="122" rx="12" fill="#eef5ff" stroke="#c9dbf4"/>
<text x="110" y="366" class="node-title">02 项目与角色参考路线</text>
<text x="110" y="393" class="body">优先直接文生视频，也可使用已有图或先生成角色图</text>
<text x="110" y="416" class="body">先出角色图：单独费用同意 → 出图 → 展示并审核</text>
<text x="110" y="443" class="code">项目记录 · character-choice</text>
<rect x="90" y="475" width="550" height="100" rx="12" fill="#eef5ff" stroke="#c9dbf4"/>
<text x="110" y="506" class="node-title">03 脚本、分镜与费用预估</text>
<text x="110" y="533" class="body">完整展示脚本，内嵌本版分镜图，列出逐段估价</text>
<text x="110" y="561" class="code">video_estimate · script.md · storyboard</text>
<rect x="90" y="605" width="550" height="90" rx="12" fill="#eef5ff" stroke="#c9dbf4"/>
<text x="110" y="636" class="node-title">04 脚本审核</text>
<text x="110" y="663" class="body">通过后固定脚本及制作参数；改稿或改参数需重审</text>
<text x="110" y="681" class="code">video_project.review</text>
<rect x="90" y="725" width="550" height="90" rx="12" fill="#eef5ff" stroke="#c9dbf4"/>
<text x="110" y="756" class="node-title">05 本段制作费用确认</text>
<text x="110" y="783" class="body">生成工具的付费审批就是制作确认，不另问开始制作</text>
<text x="110" y="801" class="code">tools/pre-execute · approval</text>
<rect x="90" y="845" width="550" height="100" rx="12" fill="#eef5ff" stroke="#c9dbf4"/>
<text x="110" y="876" class="node-title">06 生成当前一段</text>
<text x="110" y="903" class="body">首次生成或续拍；先保存原请求与任务ID，再查询结果</text>
<text x="110" y="931" class="code">video_generate / video_extend → segment-executor</text>
<rect x="90" y="975" width="550" height="100" rx="12" fill="#eff9f4" stroke="#c5e1d1"/>
<text x="110" y="1006" class="node-title">07 取回并展示本段</text>
<text x="110" y="1033" class="body">暂停时默认只下载新段；正文提供视频链接和直接预览</text>
<text x="110" y="1061" class="code">segment-run · tool-result · media-preview</text>
