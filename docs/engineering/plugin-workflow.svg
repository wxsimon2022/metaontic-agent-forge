<text x="740" y="1163" class="body">实际看过本段，再决定继续</text>
<text x="740" y="1186" class="body">取消或未答：保留成果并停住</text>
<text x="740" y="1201" class="code">review_segment</text>
<path d="M855 1105V1074" class="edge"/>
<text x="870" y="1087" class="edge-label">审核通过</text>
<rect x="720" y="945" width="270" height="125" rx="12" fill="#fff7e9" stroke="#e9c88f"/>
<text x="740" y="976" class="node-title">09 下一段费用确认</text>
<text x="740" y="1003" class="body">只生成未完成部分</text>
<text x="740" y="1026" class="body">本次新增分段仍需确认费用</text>
<text x="740" y="1056" class="code">resume → approval</text>
<path d="M855 945V895H645" class="edge"/>
