name: sync-gitee

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to mirror to Gitee
        required: true
        default: v3.3.0

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download published archives and tag notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --pattern "metaontic-video-${RELEASE_TAG#v}.tgz" \
            --dir dist
          gh release view "$RELEASE_TAG" --json body --jq .body > dist/release-notes.txt
      - name: Publish and verify every Gitee archive
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          for ARCHIVE in dist/*.tgz; do
            node scripts/publish-gitee.mjs "$RELEASE_TAG" "$ARCHIVE" dist/release-notes.txt
          done
