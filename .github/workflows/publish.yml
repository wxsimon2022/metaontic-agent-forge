name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release tag
        run: |
          node scripts/validate-release.mjs
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo 'Run this workflow on the matching version tag.'; exit 1; }
      - name: Install build tooling
        run: npm ci
      - name: Build and test
        run: npm run build && node --test tests/*.test.mjs
      - name: Pack plugin
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          VERSION=$(node -p "require('./package.json').version")
          python3 scripts/package-windows.py "dist/metaontic-video-$VERSION.tgz" "dist/MetaOnticVideo-Windows-$VERSION.zip"
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > dist/release-notes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/

  platform-install:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - name: Install fixed pnpm tooling
        run: npm install --global pnpm@11.28.5
      - name: Validate managed package installation
        shell: bash
        run: node scripts/check-package-install.mjs dist/*.tgz

  release:
    needs: [prepare, platform-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - name: Upload release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FLAGS=()
          if [ "$(node -p "Boolean(require('./package.json').releaseNotes.prerelease)")" = "true" ]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tgz dist/*.zip dist/*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/*.zip dist/*.sha256 --verify-tag --title "MetaOnticVideo $GITHUB_REF_NAME" --notes-file dist/release-notes.txt "${RELEASE_FLAGS[@]}"
          fi
      - name: Upload Gitee release package
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          export GITEE_PRERELEASE=$(node -p "Boolean(require('./package.json').releaseNotes.prerelease)")
          for ARCHIVE in dist/*.tgz dist/*.zip dist/*.sha256; do
            node scripts/publish-gitee.mjs "$GITHUB_REF_NAME" "$ARCHIVE" dist/release-notes.txt
          done
