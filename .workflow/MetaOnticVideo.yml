version: '1.0'
# 流水线唯一标识，对应 Gitee 网页上已有的这条流水线，改名会与网页记录对不上，请勿随意修改
name: 流水线-202611021547
displayName: MetaOnticVideo 构建与测试
triggers:
  # 开启自动触发
  trigger: auto
  push:
    branches:
      # 精确匹配：向 master 提交（含分支合并、PR 合并）后触发
      precise:
        - master
    tags:
      # 前缀匹配：v 开头是正式版标签（核对标签与版本一致后出成品），ci- 开头是演练标签（只演练，不做版本强校验）
      prefix:
        - v
        - ci-
  pr:
    branches:
      precise:
        - master
stages:
  - name: stage-build-test
    displayName: 安装依赖、构建与测试
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@nodejs
        name: build_test
        displayName: 安装依赖、构建与测试
        # 构建机实际使用下面命令准备的 Node 20，本字段不决定构建结果；下拉里若有 18 及以上的版本，选哪个都可以
        nodeVersion: 20.11.1
        commands:
          - 'set -x'
          - 'echo "构建机 $(uname -s -m) / $(head -1 /etc/os-release 2>/dev/null) / $(ldd --version 2>/dev/null | head -1)"'
          - 'echo "工作目录 $(pwd)"'
          - 'echo "提交 $(git log -1 --oneline 2>/dev/null)"'
          - 'echo "标签 $(git describe --tags --exact-match HEAD 2>/dev/null || echo 无)"'
          - 'env | grep -iE "^GITEE_|^GO_" | sort'
          - 'for c in curl wget tar git python3 python yum dnf apt-get; do printf "%s=%s " "$c" "$(command -v $c || echo 无)"; done; echo'
          - 'command -v node >/dev/null 2>&1 || for p in "$HOME"/.local/node/bin/node /opt/*/bin/node /opt/*/*/bin/node /usr/local/*/bin/node /usr/local/lib/nodejs/*/bin/node "$HOME"/.nvm/versions/node/*/bin/node; do [ -x "$p" ] && { export PATH="$(dirname "$p"):$PATH"; break; }; done'
          - 'if ! command -v node >/dev/null 2>&1; then'
          - 'NODE_VERSION=20.19.0'
          - 'if uname -m | grep -qE "aarch64|arm64"; then ARCH=linux-arm64; else ARCH=linux-x64; fi'
          - 'GLIBC=$(ldd --version 2>/dev/null | head -1 | grep -oE "[0-9]+\.[0-9]+$")'
          - 'if [ -n "$GLIBC" ] && [ "${GLIBC%%.*}" = 2 ] && [ "${GLIBC#*.}" -lt 28 ]; then FLAVOR="$ARCH-glibc-217"; BASE=https://cdn.npmmirror.com/binaries/node-unofficial-builds; else FLAVOR="$ARCH"; BASE=https://cdn.npmmirror.com/binaries/node; fi'
          - 'URL="$BASE/v$NODE_VERSION/node-v$NODE_VERSION-$FLAVOR.tar.gz"'
          - 'NODE_DIR="${HOME:-/tmp}/.local/node"'
          - 'mkdir -p "$NODE_DIR" /tmp/node-dl'
          - 'echo "未找到可用 Node，下载 $URL"'
          - 'if [ "$BASE" = https://cdn.npmmirror.com/binaries/node ]; then ALT="https://cdn.npmmirror.com/binaries/node-unofficial-builds/v$NODE_VERSION/node-v$NODE_VERSION-$ARCH-glibc-217.tar.gz"; else ALT="https://cdn.npmmirror.com/binaries/node/v$NODE_VERSION/node-v$NODE_VERSION-$ARCH.tar.gz"; fi'
          - 'DOWNLOADED=0'
          - 'for U in "$URL" "$ALT"; do'
          - 'echo "尝试下载 $U"'
          - 'if command -v curl >/dev/null 2>&1; then curl -fsSL --retry 2 "$U" -o /tmp/node-dl/node.tar.gz || true; else wget -qO /tmp/node-dl/node.tar.gz "$U" || true; fi'
          - 'if tar -tzf /tmp/node-dl/node.tar.gz >/dev/null 2>&1; then DOWNLOADED=1; break; fi'
          - 'done'
          - '[ "$DOWNLOADED" = 1 ] || { echo "Node 下载失败，请把本次流水线日志发给维护者"; exit 1; }'
          - 'tar -xzf /tmp/node-dl/node.tar.gz -C "$NODE_DIR" --strip-components=1'
          - 'export PATH="$NODE_DIR/bin:$PATH"'
          - 'fi'
          - 'node -v && npm -v || { echo "构建机上没有可用的 Node/npm，请把本次流水线日志发给维护者"; exit 1; }'
          - 'V=$(node -p process.versions.node | cut -d. -f1); [ "$V" -ge 18 ] || { echo "构建需要 Node 18 及以上，当前为 $V"; exit 1; }'
          - 'npm config set registry https://registry.npmmirror.com'
          - 'npm ci'
          - 'npm run build'
          - 'node --test tests/*.test.mjs'
          - 'node scripts/validate-release.mjs'
          - 'mkdir -p dist'
          - 'npm pack --pack-destination dist'
          - 'TGZ=$(ls dist/metaontic-video-*.tgz | head -1)'
          - 'VERSION=${TGZ##*/metaontic-video-}; VERSION=${VERSION%.tgz}'
          - 'echo "成品版本 $VERSION"'
          - 'TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")'
          - 'if [ -n "$TAG" ]; then echo "本次由标签 $TAG 触发"; case "$TAG" in ci-*) echo "演练标签 ${TAG}：跳过标签与包内版本的强校验，本次制品只用于演练，不能作为发布附件";; *) [ "v$VERSION" = "$TAG" ] || { echo "标签 $TAG 与包内版本 v$VERSION 不一致，停止打包：请先按标签更新版本和 releaseNotes 再发"; exit 1; };; esac; else echo "本次不是标签触发，制品仅用于核对"; fi'
          - 'PY=""'
          - 'for c in python3 python3.13 python3.12 python3.11 python3.10 python3.9 python3.8 python3.7 python3.6 python36; do P=$(command -v "$c" 2>/dev/null); [ -n "$P" ] && { PY=$P; break; }; done'
          - '[ -n "$PY" ] || for c in /usr/local/bin/python3* /usr/bin/python3* /opt/*/bin/python3*; do P=$(ls $c 2>/dev/null | head -1); [ -n "$P" ] && { PY=$P; break; }; done'
          - 'if [ -n "$PY" ] && ! "$PY" -c "import sys; sys.exit(0 if sys.version_info[0] == 3 else 1)" >/dev/null 2>&1; then PY=""; fi'
          - 'if [ -z "$PY" ]; then echo "构建机没有可用的 Python3，尝试安装"; export DEBIAN_FRONTEND=noninteractive; if command -v yum >/dev/null 2>&1; then yum install -y -q python3 || true; elif command -v dnf >/dev/null 2>&1; then dnf install -y -q python3 || true; elif command -v apt-get >/dev/null 2>&1; then apt-get update -qq || true; apt-get install -y -qq python3 || true; fi; PY=$(command -v python3 2>/dev/null); fi'
          - '[ -n "$PY" ] || { echo "需要 Python3 裁剪成品介绍文档"; exit 1; }; "$PY" scripts/strip-package-readme.py "$TGZ"'
          - 'ls -l dist'
        artifacts:
          - name: PLUGIN_PACKAGE
            path:
              - ./dist
        caches:
          - ~/.npm
          - ~/.local/node
        notify: []
        strategy:
          retry: '0'
