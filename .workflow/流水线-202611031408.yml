version: "1.0"
name: 构建、部署到自有主机
displayName: 定时定理文件
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@python
    name: ""
    displayName: Python 构建
    pythonVersion: "3.9"
    commands:
    - pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
    - "# 可以使用pip下载依赖"
    - "# pip install --user -r requirements.txt"
    - python --version
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./
      type: .tar.gz
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
variables:
  TOKEN_GITEE:
    type: TEXT
    default: 70415b1a6c3fc861580bc74b67f608e2
